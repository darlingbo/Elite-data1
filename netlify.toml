[build]
  command = "next build --webpack && node -e \"const fs=require('fs');const p='.next/server/functions-config-manifest.json';try{const m=JSON.parse(fs.readFileSync(p,'utf8'));delete m.functions['/_middleware'];fs.writeFileSync(p,JSON.stringify(m));}catch(e){}\""
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "https://elite-data1.netlify.app/*"
  to = "https://elitedata1.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
