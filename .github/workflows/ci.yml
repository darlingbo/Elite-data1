name: CI

on:
  push:
    branches: [main, master, migration/cloudflare]
  pull_request:

# Cancel superseded runs on the same branch/PR.
# The preview deployment runs only on a direct push to migration/cloudflare.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Cloudflare adapter for migration validation
        run: npm install --no-save @opennextjs/cloudflare@latest wrangler@latest

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npm test

      - name: OpenNext Cloudflare build
        run: npm run cf:build
        env:
          # Placeholder values so `next build` can collect page data in CI.
          # Real secrets live in your hosting provider, never in the repo.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_placeholder
          ADMIN_SESSION_TOKEN: placeholder-admin-token
          ADMIN_PASSWORD: placeholder
          AGENT_SESSION_SECRET: placeholder-agent-secret

      - name: Package isolated Cloudflare preview build
        uses: actions/upload-artifact@v4
        with:
          name: elite-data1-cloudflare-preview
          path: |
            .open-next/**
            wrangler.jsonc
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

      - name: Deploy isolated Cloudflare preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/migration/cloudflare'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: b1e27bc3fd229939379f3e80f7a2588e
