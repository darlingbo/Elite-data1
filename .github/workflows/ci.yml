name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npx eslint .

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # Placeholder values so `next build` can collect page data in CI.
          # Real secrets live in your hosting provider, never in the repo.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_placeholder
          ADMIN_SESSION_TOKEN: placeholder-admin-token
          ADMIN_PASSWORD: placeholder
          AGENT_SESSION_SECRET: placeholder-agent-secret
